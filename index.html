<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>药理学 · 兑换体系 · 星星累积</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', Roboto, sans-serif;
            background: #f0f4f9;
            color: #1e293b;
            padding: 12px 14px 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            user-select: none;
        }
        .container {
            max-width: 720px;
            width: 100%;
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            background: #fff;
            border-radius: 18px;
            padding: 12px 14px 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .star-total {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: #f5b342;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 30px;
            padding: 4px 16px;
            margin-bottom: 8px;
        }
        .star-total span {
            font-size: 28px;
        }
        .star-total .count {
            color: #1e293b;
            font-size: 24px;
            min-width: 40px;
            text-align: center;
        }
        .rewards-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 0 8px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .reward-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 22px;
            line-height: 1.2;
            transition: all 0.3s;
            min-width: 36px;
            opacity: 0.25;
            filter: grayscale(1);
            transform: scale(0.85);
            cursor: default;
            position: relative;
        }
        .reward-item.obtained {
            opacity: 1;
            filter: grayscale(0);
            transform: scale(1);
        }
        .reward-item .r-label {
            font-size: 9px;
            color: #8a9bb0;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 2px;
            white-space: nowrap;
        }
        .reward-item.obtained .r-label {
            color: #2d6a9f;
        }
        .reward-item .r-cost {
            font-size: 8px;
            color: #b0c0d0;
            font-weight: 500;
        }
        .reward-item.obtained .r-cost {
            color: #6a8aaa;
        }
        .reward-item.pulse {
            animation: rewardPulse 0.6s ease;
        }
        @keyframes rewardPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.6); filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-top: 1px solid #eef2f7;
            padding-top: 10px;
        }
        .bottom-row .info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .bottom-row .info .badge {
            background: #eef2f7;
            padding: 2px 12px;
            border-radius: 30px;
            color: #2d6a9f;
        }
        .bottom-row .right-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-redo {
            background: #2d6a9f;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 36px;
            box-shadow: 0 2px 8px rgba(45, 106, 159, 0.25);
            transition: all 0.15s;
        }
        .btn-redo:active {
            transform: scale(0.95);
            background: #1a4a7a;
        }

        /* ===== 卡片 ===== */
        .card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
            position: relative;
            transition: opacity 0.2s;
        }
        .question-number {
            font-size: 14px;
            color: #5b6f87;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: #fafcff;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 16px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .option:active:not(.disabled) {
            background: #eef4fe;
            transform: scale(0.98);
        }
        .option .label {
            font-weight: 700;
            color: #2d6a9f;
            min-width: 28px;
        }
        .option .text {
            flex: 1;
            color: #1e293b;
        }
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .option.correct .label { color: #155724; }
        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .option.wrong .label { color: #721c24; }
        .option.reveal {
            border-color: #ffc107;
            background: #fff3cd;
        }
        .option.reveal .label { color: #856404; }
        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }
        .feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #28a745;
        }
        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #dc3545;
        }

        .nav-arrows {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }
        .nav-arrows button {
            background: #eef2f7;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 18px;
            font-weight: 600;
            color: #2d6a9f;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 44px;
            flex: 1;
            transition: background 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .nav-arrows button:active {
            background: #d0d9e6;
            transform: scale(0.96);
        }
        .nav-arrows button:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .complete-area {
            text-align: center;
            padding: 20px 10px;
        }
        .complete-area .title {
            font-size: 22px;
            font-weight: 700;
            color: #2d6a9f;
            margin-bottom: 6px;
        }
        .complete-area .sub {
            font-size: 16px;
            color: #5b6f87;
            margin-bottom: 16px;
        }
        .complete-area .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .complete-area .actions .btn {
            padding: 10px 28px;
            border-radius: 40px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 48px;
        }
        .btn-primary {
            background: #2d6a9f;
            color: #fff;
            box-shadow: 0 4px 12px rgba(45, 106, 159, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.95);
            background: #1a4a7a;
        }
        .btn-warning {
            background: #ffc107;
            color: #1e293b;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }
        .btn-warning:active {
            transform: scale(0.95);
            background: #e0a800;
        }
        .btn-leaderboard {
            background: #8b5cf6;
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .btn-leaderboard:active {
            transform: scale(0.95);
            background: #6d3fd8;
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .back-bar .btn-back {
            background: #e9ecef;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 36px;
        }
        .back-bar .btn-back:active {
            background: #d0d7de;
        }

        /* ===== 奖励动画浮层 ===== */
        .reward-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reward-float {
            position: absolute;
            font-size: 100px;
            line-height: 1;
            opacity: 0;
            transform: scale(0.3) rotate(-10deg);
            transition: none;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            will-change: transform, opacity, top, left;
            filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.3));
        }
        .reward-float.animate-in {
            animation: rewardPopIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes rewardPopIn {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            60% { opacity: 1; transform: scale(1.3) rotate(4deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* ===== 排行榜模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h2 {
            font-size: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }
        .modal-box .close-btn {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8a9bb0;
        }
        .modal-box .close-btn:hover { color: #1e293b; }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            font-size: 15px;
        }
        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-item .rank {
            font-weight: 700;
            color: #2d6a9f;
            min-width: 32px;
        }
        .leaderboard-item .name {
            font-weight: 600;
            flex: 1;
            margin-left: 8px;
        }
        .leaderboard-item .stats {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #5b6f87;
            font-size: 13px;
        }
        .leaderboard-item .stats .rewards {
            font-size: 16px;
            letter-spacing: 1px;
        }
        .empty-leaderboard {
            text-align: center;
            color: #8a9bb0;
            padding: 30px 0;
            font-size: 16px;
        }
        .modal-box .name-input-area {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .modal-box .name-input-area input {
            flex: 1;
            padding: 8px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            background: #fafcff;
        }
        .modal-box .name-input-area input:focus {
            border-color: #2d6a9f;
        }
        .modal-box .name-input-area button {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            background: #2d6a9f;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 暗色模式 */
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a2e; color: #e8edf5; }
            .header, .card, .modal-box { background: #262640; border-color: #3a3a5a; }
            .bottom-row .info .badge { background: #2a2a4a; color: #aaccff; }
            .bottom-row { border-top-color: #3a3a5a; }
            .option { background: #2a2a4a; border-color: #4a4a6a; }
            .option .text { color: #e8edf5; }
            .option .label { color: #aaccff; }
            .option.correct { background: #1e3a2a; border-color: #28a745; }
            .option.wrong { background: #3a1e2a; border-color: #dc3545; }
            .option.reveal { background: #3a3a1a; border-color: #ffc107; }
            .feedback.correct { background: #1e3a2a; color: #a8e6b0; }
            .feedback.wrong { background: #3a1e2a; color: #f5a0a8; }
            .question-text { color: #e8edf5; }
            .question-number { color: #8899bb; }
            .complete-area .title { color: #aaccff; }
            .complete-area .sub { color: #8899bb; }
            .back-bar .btn-back { background: #3a3a5a; color: #e8edf5; }
            .reward-item .r-label { color: #6a7a8a; }
            .reward-item.obtained .r-label { color: #aaccff; }
            .reward-item .r-cost { color: #5a6a7a; }
            .reward-item.obtained .r-cost { color: #7a9abb; }
            .leaderboard-item { border-bottom-color: #3a3a5a; }
            .leaderboard-item .rank { color: #aaccff; }
            .leaderboard-item .stats { color: #8899bb; }
            .modal-box h2 { color: #e8edf5; }
            .modal-box .name-input-area input { background: #2a2a4a; border-color: #4a4a6a; color: #e8edf5; }
            .empty-leaderboard { color: #6a7a8a; }
            .nav-arrows button { background: #3a3a5a; color: #aaccff; }
            .nav-arrows button:active { background: #4a4a6a; }
            .star-total { background: rgba(255, 215, 0, 0.12); }
            .star-total .count { color: #e8edf5; }
        }
        @media (max-width: 480px) {
            .reward-item { font-size: 18px; min-width: 30px; }
            .reward-item .r-label { font-size: 7px; }
            .reward-item .r-cost { font-size: 7px; }
            .bottom-row .info { font-size: 13px; }
            .question-text { font-size: 16px; }
            .option { font-size: 15px; padding: 10px 14px; min-height: 44px; }
            .reward-float { font-size: 72px; }
            .modal-box { padding: 18px; }
            .nav-arrows button { font-size: 16px; padding: 6px 12px; min-height: 38px; }
            .star-total { font-size: 17px; padding: 2px 12px; }
            .star-total span { font-size: 22px; }
            .star-total .count { font-size: 20px; }
        }
        @media (max-width: 380px) {
            .reward-item { font-size: 15px; min-width: 24px; }
            .reward-item .r-label { font-size: 6px; }
            .reward-item .r-cost { font-size: 6px; }
        }
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 36px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            color: #2d6a9f;
        }
        .swipe-indicator.show { opacity: 0.6; }
        .swipe-left { left: 4px; }
        .swipe-right { right: 4px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 头部 -->
        <div class="header" id="mainHeader">
            <!-- 星星总数显示 -->
            <div class="star-total">
                <span>⭐</span>
                <span class="count" id="starCountDisplay">0</span>
                <span style="font-weight:400; font-size:16px; color:#6a8aaa;">累积星星</span>
            </div>
            <div class="rewards-row" id="rewardsRow"></div>
            <div class="bottom-row">
                <div class="info">
                    <span id="progress">第 1 / 68 题</span>
                    <span class="badge" id="streakBadge">🔥 连续 0 题</span>
                </div>
                <div class="right-btns">
                    <button class="btn-redo" id="redoBtn">⟳ 重做</button>
                </div>
            </div>
        </div>

        <!-- 主卡片 -->
        <div id="mainCard">
            <div class="card" id="questionCard">
                <div class="question-number" id="qNum"></div>
                <div class="question-text" id="qText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
                <div class="nav-arrows">
                    <button id="prevBtn" disabled>◀ 上一题</button>
                    <button id="nextBtn">下一题 ▶</button>
                </div>
                <div class="swipe-indicator swipe-left" id="swipeLeft">‹</div>
                <div class="swipe-indicator swipe-right" id="swipeRight">›</div>
            </div>
            <div id="completeArea" style="display:none;">
                <div class="card complete-area">
                    <div class="title">🎉 恭喜完成全部题目！</div>
                    <div class="sub" id="finalStats"></div>
                    <div class="actions" id="completeActions"></div>
                </div>
            </div>
        </div>

        <!-- 错题重练 -->
        <div id="wrongCard" style="display:none;">
            <div class="back-bar">
                <button class="btn-back" id="backFromWrong">← 返回主界面</button>
                <span id="wrongProgress" style="font-weight:600;">错题 第 1 / 0 题</span>
            </div>
            <div class="card">
                <div class="question-number" id="wrongQNum"></div>
                <div class="question-text" id="wrongQText"></div>
                <div class="options" id="wrongOptionsContainer"></div>
                <div class="feedback" id="wrongFeedback"></div>
                <div class="nav-arrows">
                    <button id="wrongPrevBtn" disabled>◀ 上一题</button>
                    <button id="wrongNextBtn">下一题 ▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 排行榜模态框 -->
    <div class="modal-overlay" id="leaderboardModal">
        <div class="modal-box">
            <button class="close-btn" id="closeLeaderboardBtn">✕</button>
            <h2>🏆 本地排行榜</h2>
            <div id="leaderboardList"></div>
            <div class="name-input-area">
                <input type="text" id="playerNameInput" placeholder="输入你的昵称" maxlength="12" value="玩家">
                <button id="saveNameBtn">保存</button>
            </div>
            <div style="font-size:12px; color:#8a9bb0; margin-top:4px; text-align:center;">* 记录保存在本地浏览器中，换设备不共享</div>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const questionsData = [
            { id: 1, question: '符合用药目的，或能达到防治疾病效果的作用称为（　）', options: ['治疗作用', '不良反应', '副作用', '毒性作用', '变态反应'], correct: 'A' },
            { id: 2, question: '药物产生副作用的药理学基础是（　）', options: ['药物安全范围小', '用药时间过久', '患者肝肾功能差', '药物作用的选择性低', '用药剂量过大'], correct: 'D' },
            { id: 3, question: '药物作用的二重性是指（　）', options: ['治疗作用和副作用', '对因治疗和对症治疗', '治疗作用和毒性作用', '治疗作用和不良反应', '局部作用和吸收作用'], correct: 'D' },
            { id: 4, question: '药物的亲和力是指（　）', options: ['药物穿透生物膜的能力', '药物激动受体产生效应的能力', '药物识别受体的能力', '药物与受体结合的能力', '药物阻断受体的能力'], correct: 'D' },
            { id: 5, question: '受体阻滞药是指（　）', options: ['具有亲和力和内在活性的药物', '具有亲和力而无内在活性的药物', '具有亲和力和较弱的内在活性的药物', '直接作用于受体的药物', '以上都不是'], correct: 'B' },

        // ================================================================

        // ================================================================
        function playRewardSound() {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.25);
                osc.frequency.exponentialRampToValueAtTime(1600, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.6);
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(900, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.3);
                gain2.gain.setValueAtTime(0.08, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc2.start(ctx.currentTime + 0.05);
                osc2.stop(ctx.currentTime + 0.55);
            } catch (_) {}
        }

        }
        function saveLeaderboard(scores) {
            localStorage.setItem('pharma_leaderboard', JSON.stringify(scores));
        }
        function addScoreToLeaderboard(name, streakCount, rewardsCount) {
            const scores = getLeaderboard();
            scores.push({ name: name || '玩家', streak: streakCount, rewards: rewardsCount, date: new Date().toLocaleString() });
            scores.sort((a, b) => b.streak - a.streak || b.rewards - a.rewards);
            if (scores.length > 50) scores.length = 50;
            saveLeaderboard(scores);
        }
        function renderLeaderboard() {
            const scores = getLeaderboard();
            if (scores.length === 0) {
                leaderboardList.innerHTML = `<div class="empty-leaderboard">还没有记录，快去闯关吧！</div>`;
                return;
            }
            let html = '';
            scores.forEach((item, index) => {
                const rank = index + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                let rewardIcons = '';
                const allRewards = ['⭐', '🌙', '🌞', '⚜️', '🔱', '👑'];
                for (let i = 0; i < Math.min(item.rewards, allRewards.length); i++) rewardIcons += allRewards[i];
                html += `
                    <div class="leaderboard-item">
                        <span class="rank">${medal}</span>
                        <span class="name">${escapeHtml(item.name)}</span>
                        <div class="stats">
                            <span>🔥 ${item.streak}</span>
                            <span class="rewards">${rewardIcons || '-'}</span>
                            <span style="font-size:11px; color:#8a9bb0;">${item.date}</span>
                        </div>
                    </div>
                `;
            });
            leaderboardList.innerHTML = html;
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function openLeaderboard() {
            renderLeaderboard();
            leaderboardModal.classList.add('active');
            const savedName = localStorage.getItem('pharma_player_name');
            if (savedName) { playerNameInput.value = savedName;
                playerName = savedName; }
        }
        function closeLeaderboard() {
            leaderboardModal.classList.remove('active');
        }

        // ================================================================
        //  奖励渲染与更新
        // ================================================================
        function renderRewards() {
            let html = '';
            REWARD_DEFS.forEach(r => {
                const obtained = obtainedRewards.has(r.id);
                html += `
                    <div class="reward-item ${obtained ? 'obtained' : ''}" data-reward="${r.id}">
                        <span style="font-size:28px; line-height:1.2;">${r.icon}</span>
                        <span class="r-label">${r.label}</span>
                        <span class="r-cost">${r.cost}⭐</span>
                    </div>
                `;
            });
            rewardsRow.innerHTML = html;
        }

        function updateRewardObtained(rewardId) {
            const items = rewardsRow.querySelectorAll('.reward-item');
            items.forEach(el => {
                if (el.dataset.reward === rewardId) {
                    el.classList.add('obtained');
                    el.classList.remove('pulse');
                    void el.offsetWidth;
                    el.classList.add('pulse');
                }
            });
        }

        // 检查是否满足新奖励解锁条件（按cost升序）
        function checkAndUnlockRewards() {
            if (isAnimating) return;
            // 找出所有未解锁且totalStars >= cost的奖励
            const toUnlock = REWARD_DEFS.filter(r => !obtainedRewards.has(r.id) && totalStars >= r.cost);
            if (toUnlock.length === 0) return;
            // 只解锁第一个（最低cost的），避免同时多个动画
            const reward = toUnlock[0];
            obtainedRewards.add(reward.id);
            playRewardSound();
            showRewardAnimation(reward);
            updateRewardObtained(reward.id);
            // 递归检查下一个（可能还有）
            setTimeout(() => checkAndUnlockRewards(), 800);
        }

        // ================================================================
        //  奖励动画
        // ================================================================
        function showRewardAnimation(reward) {
            if (isAnimating) return;
            isAnimating = true;
            const overlay = document.createElement('div');
            overlay.className = 'reward-overlay';
            overlay.id = 'rewardOverlay';
            const floatEl = document.createElement('div');
            floatEl.className = 'reward-float';
            floatEl.textContent = reward.icon;
            overlay.appendChild(floatEl);
            document.body.appendChild(overlay);
            requestAnimationFrame(() => floatEl.classList.add('animate-in'));
            const targetEl = rewardsRow.querySelector(`.reward-item[data-reward="${reward.id}"]`);
            let targetRect = null;
            if (targetEl) targetRect = targetEl.getBoundingClientRect();
            setTimeout(() => {
                if (targetRect) {
                    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
                    const dx = targetRect.left + targetRect.width / 2 - cx;
                    const dy = targetRect.top + targetRect.height / 2 - cy;
                    floatEl.style.transition = 'all 0.8s cubic-bezier(0.34, 1.0, 0.64, 1)';
                    floatEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.5)`;
                    floatEl.style.opacity = '0.7';
                } else {
                    floatEl.style.transition = 'opacity 0.5s';
                    floatEl.style.opacity = '0';
                }
            }, 800);
            setTimeout(() => {
                if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
                updateRewardObtained(reward.id);
                isAnimating = false;
            }, 1800);
        }

        // ================================================================
        //  更新UI
        // ================================================================
        function updateStarDisplay() {
            starCountDisplay.textContent = totalStars;
        }

        function updateStreakBadge() {
            streakBadge.textContent = `🔥 连续 ${streak} 题`;
        }

        function updateProgress() {
            progressEl.textContent = `第 ${currentIndex + 1} / ${total} 题`;
            if (prevBtn) {
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex >= total - 1);
            }
        }

        // ================================================================
        //  增加星星（答对时调用）
        // ================================================================
        function addStars(base, bonus) {
            const earned = base + bonus;
            totalStars += earned;
            updateStarDisplay();
            // 检查解锁
            checkAndUnlockRewards();
            // 反馈中显示获得星星数
            return earned;
        }

        // ================================================================
        //  核心渲染
        // ================================================================
        function renderQuestion() {
            if (currentIndex >= total) {
                // 完成时保存成绩（连续答对数和解锁奖励数）
                const rewardsCount = obtainedRewards.size;
                addScoreToLeaderboard(playerName, streak, rewardsCount);

                questionCard.style.display = 'none';
                completeArea.style.display = 'block';
                const wrongCount = wrongList.length;
                let rewardStr = '';
                REWARD_DEFS.forEach(r => {
                    if (obtainedRewards.has(r.id)) rewardStr += r.icon;
                });
                finalStats.textContent =
                    `连续答对 ${streak} 题，错题 ${wrongCount} 题。累积星星 ${totalStars}，解锁奖励：${rewardStr || '无'}`;
                let html = '';
                if (wrongCount > 0) {
                    html += `<button class="btn btn-warning" id="startWrongBtn">📝 错题重练 (${wrongCount}题)</button>`;
                }
                html += `<button class="btn btn-primary" id="redoFromCompleteBtn">⟳ 重新开始</button>`;
                html += `<button class="btn btn-leaderboard" id="showLeaderboardFromComplete">🏆 排行榜</button>`;
                completeActions.innerHTML = html;
                document.getElementById('startWrongBtn')?.addEventListener('click', startWrongMode);
                document.getElementById('redoFromCompleteBtn').addEventListener('click', resetMainState);
                document.getElementById('showLeaderboardFromComplete').addEventListener('click', openLeaderboard);
                return;
            }

            const q = questionsData[currentIndex];
            qNum.textContent = `第 ${q.id} 题`;
            qText.textContent = q.question;

            const labels = ['A', 'B', 'C', 'D', 'E'];
            let html = '';
            q.options.forEach((opt, idx) => {
                html += `
                    <div class="option" data-index="${idx}" onclick="selectOption(${idx})">
                        <span class="label">${labels[idx]}.</span>
                        <span class="text">${opt}</span>
                    </div>
                `;
            });
            optionsContainer.innerHTML = html;
            feedbackEl.classList.remove('show', 'correct', 'wrong');
            feedbackEl.textContent = '';
            answered = false;

            // 检查是否已答
            const record = answerRecord[q.id];
            if (record && record.answered) {
                answered = true;
                const opts = document.querySelectorAll('#optionsContainer .option');
                opts.forEach(el => el.classList.add('disabled'));
                const correctIdx = labels.indexOf(q.correct);
                if (record.correct) {
                    opts[correctIdx].classList.add('correct');
                    feedbackEl.textContent = '✅ 回答正确 (已答)';
                    feedbackEl.className = 'feedback show correct';
                } else {
                    opts[correctIdx].classList.add('reveal');
                    feedbackEl.textContent = `❌ 回答错误，正确答案是 ${q.correct} (已答)`;
                    feedbackEl.className = 'feedback show wrong';
                }
            } else {
                document.querySelectorAll('#optionsContainer .option').forEach(el => {
                    el.classList.remove('disabled', 'correct', 'wrong', 'reveal');
                });
            }
            updateProgress();
            updateStreakBadge();
        }

        // ================================================================
        //  选择选项（主流程）
        // ================================================================
        function selectOption(idx) {
            if (answered || isWrongMode || currentIndex >= total || isAnimating) return;
            const q = questionsData[currentIndex];
            const labels = ['A', 'B', 'C', 'D', 'E'];
            const selectedLabel = labels[idx];
            const isCorrect = (selectedLabel === q.correct);

            const id = q.id;
            if (!answerRecord[id]) answerRecord[id] = {};
            answerRecord[id].answered = true;
            answerRecord[id].correct = isCorrect;

            const opts = document.querySelectorAll('#optionsContainer .option');
            opts.forEach(el => el.classList.add('disabled'));
            const selectedEl = opts[idx];

            if (isCorrect) {
                selectedEl.classList.add('correct');
                streak++;
                // 计算星星奖励：基础1 + 连续奖励（每连续2题额外+1）
                const bonus = Math.floor(streak / 2);
                const earned = addStars(1, bonus);
                feedbackEl.textContent = `✅ 回答正确！+${earned} ⭐ (连续奖励+${bonus})`;
                feedbackEl.className = 'feedback show correct';
            } else {
                selectedEl.classList.add('wrong');
                const correctIdx = labels.indexOf(q.correct);
                opts[correctIdx].classList.add('reveal');
                if (!wrongList.includes(id)) wrongList.push(id);
                streak = 0;
                feedbackEl.textContent = `❌ 回答错误，正确答案是 ${q.correct}`;
                feedbackEl.className = 'feedback show wrong';
            }
            updateStreakBadge();

            answered = true;
            if (timerId) clearTimeout(timerId);
            timerId = setTimeout(() => {
                if (currentIndex < total - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    currentIndex++;
                    renderQuestion();
                }
                timerId = null;
            }, 900);
        }

        // ================================================================
        //  导航
        // ================================================================
        function goToPrev() {
            if (isWrongMode) return;
            if (currentIndex > 0) {
                if (timerId) { clearTimeout(timerId);
                    timerId = null; }
                currentIndex--;
                renderQuestion();
            }
        }
        function goToNext() {
            if (isWrongMode) return;
            if (currentIndex < total - 1) {
                if (timerId) { clearTimeout(timerId);
                    timerId = null; }
                currentIndex++;
                renderQuestion();
            }
        }
        function goToWrongPrev() {
            if (!isWrongMode) return;
            if (wrongIndex > 0) {
                if (wrongTimerId) { clearTimeout(wrongTimerId);
                    wrongTimerId = null; }
                wrongIndex--;
                renderWrongQuestion();
            }
        }
        function goToWrongNext() {
            if (!isWrongMode) return;
            if (wrongIndex < wrongList.length - 1) {
                if (wrongTimerId) { clearTimeout(wrongTimerId);
                    wrongTimerId = null; }
                wrongIndex++;
                renderWrongQuestion();
            }
        }

        // ================================================================
        //  滑动
        // ================================================================
        function setupSwipe(element) {
            if (!element) return;
            element.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
                isSwiping = false;
            }, { passive: true });
            element.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    const dx = e.touches[0].screenX - touchStartX;
                    const dy = e.touches[0].screenY - touchStartY;
                    if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy) * 0.8) {
                        isSwiping = true;
                        const leftInd = document.getElementById('swipeLeft');
                        const rightInd = document.getElementById('swipeRight');
                        if (leftInd && rightInd) {
                            if (dx < 0) { rightInd.classList.add('show');
                                leftInd.classList.remove('show'); } else { leftInd.classList.add('show');
                                rightInd.classList.remove('show'); }
                        }
                    }
                }
            }, { passive: true });
            element.addEventListener('touchend', function(e) {
                if (!isSwiping) return;
                const dx = e.changedTouches[0].screenX - touchStartX;
                const dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 0.8) {
                    if (dx < 0) { if (!isWrongMode) goToNext();
                        else goToWrongNext(); } else { if (!isWrongMode) goToPrev();
                        else goToWrongPrev(); }
                }
                document.getElementById('swipeLeft')?.classList.remove('show');
                document.getElementById('swipeRight')?.classList.remove('show');
                isSwiping = false;
            }, { passive: true });
        }

        // ================================================================
        //  重置
        // ================================================================
        function resetMainState() {
            if (timerId) clearTimeout(timerId);
            timerId = null;
            if (wrongTimerId) clearTimeout(wrongTimerId);
            wrongTimerId = null;
            currentIndex = 0;
            streak = 0;
            totalStars = 0;
            answered = false;
            answerRecord = {};
            wrongList = [];
            isWrongMode = false;
            wrongIndex = 0;
            wrongAnswered = false;
            obtainedRewards = new Set();
            isAnimating = false;
            document.getElementById('rewardOverlay')?.remove();

            wrongCard.style.display = 'none';
            document.getElementById('mainCard').style.display = 'block';
            completeArea.style.display = 'none';
            questionCard.style.display = 'block';

            renderRewards();
            updateStarDisplay();
            updateStreakBadge();
            renderQuestion();
        }

        // ================================================================
        //  错题重练
        // ================================================================
        function startWrongMode() {
            if (wrongList.length === 0) return;
            isWrongMode = true;
            document.getElementById('mainCard').style.display = 'none';
            wrongCard.style.display = 'block';
            wrongIndex = 0;
            wrongAnswered = false;
            renderWrongQuestion();
            updateWrongNavButtons();
        }

        function renderWrongQuestion() {
            if (wrongIndex >= wrongList.length) {
                wrongFeedback.textContent = '🎉 错题已全部掌握！';
                wrongFeedback.className = 'feedback show correct';
                wrongOptionsContainer.innerHTML = '';
                wrongQText.textContent = '恭喜！你已攻克所有错题！';
                wrongQNum.textContent = '';
                wrongProgress.textContent = `错题 已完成！`;
                wrongPrevBtn.disabled = true;
                wrongNextBtn.disabled = true;
                return;
            }
            const id = wrongList[wrongIndex];
            const q = questionsData.find(item => item.id === id);
            if (!q) { wrongList.splice(wrongIndex, 1);
                renderWrongQuestion(); return; }
            wrongQNum.textContent = `错题 ${wrongIndex + 1} / ${wrongList.length}`;
            wrongQText.textContent = q.question;
            const labels = ['A', 'B', 'C', 'D', 'E'];
            let html = '';
            q.options.forEach((opt, idx) => {
                html += `
                    <div class="option" data-wrong-index="${idx}" onclick="selectWrongOption(${idx})">
                        <span class="label">${labels[idx]}.</span>
                        <span class="text">${opt}</span>
                    </div>
                `;
            });
            wrongOptionsContainer.innerHTML = html;
            wrongFeedback.classList.remove('show', 'correct', 'wrong');
            wrongFeedback.textContent = '';
            wrongAnswered = false;
            document.querySelectorAll('#wrongOptionsContainer .option').forEach(el => {
                el.classList.remove('disabled', 'correct', 'wrong', 'reveal');
            });
            wrongProgress.textContent = `错题 ${wrongIndex + 1} / ${wrongList.length}`;
            updateWrongNavButtons();
        }

        function updateWrongNavButtons() {
            if (wrongPrevBtn) {
                wrongPrevBtn.disabled = (wrongIndex === 0);
                wrongNextBtn.disabled = (wrongIndex >= wrongList.length - 1);
            }
        }

        function selectWrongOption(idx) {
            if (wrongAnswered || wrongIndex >= wrongList.length) return;
            const id = wrongList[wrongIndex];
            const q = questionsData.find(item => item.id === id);
            if (!q) return;
            const labels = ['A', 'B', 'C', 'D', 'E'];
            const selectedLabel = labels[idx];
            const isCorrect = (selectedLabel === q.correct);

            const opts = document.querySelectorAll('#wrongOptionsContainer .option');
            opts.forEach(el => el.classList.add('disabled'));
            const selectedEl = opts[idx];

            if (isCorrect) {
                selectedEl.classList.add('correct');
                wrongList.splice(wrongIndex, 1);
                wrongFeedback.textContent = '✅ 回答正确！已从错题移除。';
                wrongFeedback.className = 'feedback show correct';
            } else {
                selectedEl.classList.add('wrong');
                const correctIdx = labels.indexOf(q.correct);
                opts[correctIdx].classList.add('reveal');
                wrongFeedback.textContent = `❌ 回答错误，正确答案是 ${q.correct}。保留本题。`;
                wrongFeedback.className = 'feedback show wrong';
                wrongIndex++;
            }
            wrongAnswered = true;

            if (wrongTimerId) clearTimeout(wrongTimerId);
            wrongTimerId = setTimeout(() => {
                if (wrongList.length === 0) {
                    renderWrongQuestion();
                } else {
                    if (wrongIndex >= wrongList.length) wrongIndex = 0;
                    renderWrongQuestion();
                }
                wrongTimerId = null;
            }, 900);
        }

        function backFromWrong() {
            if (wrongTimerId) clearTimeout(wrongTimerId);
            wrongTimerId = null;
            isWrongMode = false;
            wrongCard.style.display = 'none';
            document.getElementById('mainCard').style.display = 'block';
            if (currentIndex >= total) {
                completeArea.style.display = 'block';
                questionCard.style.display = 'none';
                const wrongCount = wrongList.length;
                let rewardStr = '';
                REWARD_DEFS.forEach(r => {
                    if (obtainedRewards.has(r.id)) rewardStr += r.icon;
                });
                finalStats.textContent =
                    `连续答对 ${streak} 题，错题 ${wrongCount} 题。累积星星 ${totalStars}，解锁奖励：${rewardStr || '无'}`;
                let html = '';
                if (wrongCount > 0) {
                    html += `<button class="btn btn-warning" id="startWrongBtn">📝 错题重练 (${wrongCount}题)</button>`;
                }
                html += `<button class="btn btn-primary" id="redoFromCompleteBtn">⟳ 重新开始</button>`;
                html += `<button class="btn btn-leaderboard" id="showLeaderboardFromComplete">🏆 排行榜</button>`;
                completeActions.innerHTML = html;
                document.getElementById('startWrongBtn')?.addEventListener('click', startWrongMode);
                document.getElementById('redoFromCompleteBtn').addEventListener('click', resetMainState);
                document.getElementById('showLeaderboardFromComplete').addEventListener('click', openLeaderboard);
            } else {
                renderQuestion();
            }
        }

        // ================================================================
        //  初始化
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedName = localStorage.getItem('pharma_player_name');
            if (savedName) { playerName = savedName;
                playerNameInput.value = savedName; }

            renderRewards();
            resetMainState();

            document.getElementById('redoBtn').addEventListener('click', resetMainState);
            document.getElementById('backFromWrong').addEventListener('click', backFromWrong);
            document.getElementById('closeLeaderboardBtn').addEventListener('click', closeLeaderboard);
            leaderboardModal.addEventListener('click', function(e) {
                if (e.target === this) closeLeaderboard();
            });
            document.getElementById('saveNameBtn').addEventListener('click', function() {
                const name = playerNameInput.value.trim() || '玩家';
                playerName = name;
                localStorage.setItem('pharma_player_name', name);
                if (leaderboardModal.classList.contains('active')) renderLeaderboard();
            });

            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);
            wrongPrevBtn.addEventListener('click', goToWrongPrev);
            wrongNextBtn.addEventListener('click', goToWrongNext);

            setupSwipe(document.getElementById('questionCard'));
            setupSwipe(document.getElementById('wrongCard'));

            document.addEventListener('keydown', function(e) {
                if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    resetMainState();
                }
                if (e.key === 'Escape') closeLeaderboard();
                if (e.key === 'ArrowLeft') { if (!isWrongMode) goToPrev();
                    else goToWrongPrev(); }
                if (e.key === 'ArrowRight') { if (!isWrongMode) goToNext();
                    else goToWrongNext(); }
            });

            // 暴露全局
            window.selectOption = selectOption;
            window.selectWrongOption = selectWrongOption;
            window.startWrongMode = startWrongMode;
            window.backFromWrong = backFromWrong;
            window.resetMainState = resetMainState;
            window.openLeaderboard = openLeaderboard;
            window.closeLeaderboard = closeLeaderboard;
            window.goToPrev = goToPrev;
            window.goToNext = goToNext;
            window.goToWrongPrev = goToWrongPrev;
            window.goToWrongNext = goToWrongNext;
        });
    </script>
</body>
</html>
