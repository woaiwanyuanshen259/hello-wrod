<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BeerMas 2027 考研作文模板拼写练习</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --text:#111827; --muted:#6b7280;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  header{background:#111827; color:#fff; padding:18px 20px}
  header h1{margin:0; font-size:19px}
  header p{margin:4px 0 0; color:#9ca3b8; font-size:13px}

  .tabs{display:flex; gap:8px; padding:12px 18px 0; max-width:900px; margin:0 auto; flex-wrap:wrap}
  .tab{border:0; background:#e5e7eb; color:#374151; padding:8px 18px; border-radius:999px; font-size:14px; cursor:pointer}
  .tab.active{background:var(--blue); color:#fff}

  .wrap{max-width:900px; margin:0 auto; padding:18px}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
  .card{
    background:var(--card); border-radius:12px; padding:16px;
    box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer;
    transition:.15s; border:1px solid transparent;
  }
  .card:hover{border-color:var(--blue); transform:translateY(-1px)}
  .card h3{margin:0 0 8px; font-size:16px}
  .card .meta{font-size:13px; color:var(--muted)}
  .bar{height:6px; background:#eef2f7; border-radius:99px; overflow:hidden; margin-top:10px}
  .bar i{display:block; height:100%; background:var(--green); width:0}
  .hidden{display:none !important}

  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  button{border:0; border-radius:8px; padding:9px 14px; font-size:14px; background:var(--blue); color:#fff; cursor:pointer}
  button.ghost{background:#eef2ff; color:var(--blue)}
  button:disabled{opacity:.45; cursor:not-allowed}
  .back{background:#e5e7eb; color:#111}

  .mode-tabs{display:flex; gap:3px; background:#e5e7eb; padding:3px; border-radius:8px}
  .mode-tab{border:0; background:transparent; padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; color:#374151}
  .mode-tab.active{background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.1); color:var(--blue); font-weight:600}

  .sent-nav{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 12px}
  .nav-chip{width:30px; height:30px; padding:0; border-radius:8px; background:#e5e7eb; color:#4b5563; font-size:12px; line-height:30px; text-align:center}
  .nav-chip.cur{outline:2px solid var(--blue); outline-offset:1px; font-weight:700}
  .nav-chip.mastered{background:#dcfce7; color:#166534}
  .nav-chip.review{background:#fee2e2; color:#991b1b}
  .nav-chip.learning{background:#dbeafe; color:#1d4ed8}

  .sentence-box{
    background:var(--card); border-radius:12px; padding:18px; margin-top:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .zh{
    color:var(--muted); font-size:15px; margin-bottom:14px; padding-bottom:10px;
    border-bottom:1px dashed var(--line); transition:filter .18s, opacity .18s;
  }
  .zh.blurred{filter:blur(5px); opacity:.55; user-select:none; cursor:pointer}
  .zh-full{margin-bottom:10px; font-size:14px}
  .words{display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 4px; min-height:44px}
  .slot{display:inline-block; position:relative; vertical-align:bottom; margin:2px 4px 2px 0}
  .slot .display{
    min-width:1ch; white-space:pre; padding:2px 4px;
    border-bottom:2px solid #c7d2fe; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:17px; letter-spacing:.3px;
  }
  .slot.active .display{border-bottom-color:var(--blue)}
  .slot.completed .display{border-bottom-color:transparent; color:var(--green)}
  .slot.locked .display{border-bottom-color:#e5e7eb; color:#9ca3af}
  .slot.placeholder .display{color:#9ca3af; border-bottom-color:transparent; background:#f3f4f6; border-radius:4px}
  .slot.placeholder{max-width:100%}
  .slot.placeholder .display{white-space:normal; word-break:break-word; max-width:100%}
  .slot .hidden-input{position:absolute; inset:0; width:100%; opacity:0; border:0; outline:0; font-size:17px; caret-color:transparent}
  .slot.shake{animation:shake .25s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .ok{color:var(--text)}
  .bad{color:var(--red); text-decoration:underline wavy var(--red)}
  .neutral{color:var(--muted)}
  .caret{display:inline-block; width:1px; height:1.1em; background:var(--blue); animation:blink 1s infinite; vertical-align:text-bottom}
  @keyframes blink{50%{opacity:0}}

  /* 全文默写：所有单词下划线长度统一，无法看出单词有几个字母 */
  .slot.nolen .display{width:30px; min-width:30px; padding:2px 0; text-align:left; overflow:hidden}
  .slot.nolen.w2 .display{width:22px; min-width:22px}
  .slot.nolen.w3 .display{width:32px; min-width:32px}
  .slot.nolen.active .display{width:auto; min-width:22px; text-align:left; overflow:visible}
  .slot.nolen.completed .display{width:auto; min-width:0; text-align:left; padding:2px 4px}

  .full-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
  .full-head-title{font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.3px}
  .full-head button{padding:5px 10px; font-size:12px}

  .full-lines{display:flex; flex-direction:column; gap:2px; margin-top:4px}
  .full-line{display:flex; gap:8px; padding:6px; border-radius:8px; border-left:3px solid transparent; transition:background .2s}
  .full-line .words{flex:1; min-width:0; min-height:30px; gap:4px 2px}
  .full-line.cur{background:#f5f8ff; border-left-color:#93c5fd}
  .full-line.pass{background:#f0fdf4; border-left-color:var(--green)}
  .full-line.fail{background:#fef2f2; border-left-color:var(--red)}
  .line-no{
    flex:0 0 24px; width:24px; height:24px; margin-top:3px; border-radius:50%;
    background:#eef2ff; color:#4338ca; font-size:12px;
    display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  }
  .full-line.pass .line-no{background:#bbf7d0; color:#14532d}
  .full-line.fail .line-no{background:#fecaca; color:#7f1d1d}

  .answer{
    margin-top:16px; padding:14px; border-radius:10px; background:#f0fdf4;
    border:1px solid #bbf7d0; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:15px; white-space:normal; line-height:1.8;
  }
  .answer .label{font-family:inherit; color:var(--green); font-size:12px; margin-bottom:6px; font-weight:600}
  .ans-line{display:flex; gap:8px; margin:3px 0}
  .ans-no{flex:0 0 20px; color:var(--green); font-size:12px; padding-top:3px; font-variant-numeric:tabular-nums}
  .ans-text{flex:1; min-width:0; word-break:break-word}

  .dict-link{
    color:inherit; text-decoration:none; border-bottom:1px dashed #93c5fd;
    transition:all .15s; cursor:pointer;
  }
  .dict-link:hover{color:var(--blue); border-bottom-color:var(--blue); background:#eff6ff}

  .controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .progress-line{font-size:13px; color:var(--muted); margin-top:10px}
  .hint{font-size:12px; color:var(--muted); margin-top:10px}

  .run-note{margin-top:12px; padding:8px 10px; border-radius:8px; font-size:13px; background:#f8fafc; border:1px dashed var(--line); color:var(--muted)}
  .run-note.pass{background:#f0fdf4; border-color:#bbf7d0; color:#166534}
  .run-note.fail{background:#fef2f2; border-color:#fecaca; color:#991b1b}

  .feedback{margin-top:14px; padding:12px; border-radius:10px; background:#f8fafc; border:1px solid var(--line); font-size:14px}
  .fb-sum{font-weight:600; margin-bottom:6px}
  .fb-item{display:flex; gap:8px; padding:7px 0; border-top:1px dashed var(--line)}
  .fb-no{flex:0 0 20px; color:var(--muted); font-size:12px; padding-top:2px; font-variant-numeric:tabular-nums}
  .fb-body{flex:1; min-width:0}
  .fb-en{color:#374151; font-size:13px; margin-top:3px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; word-break:break-word}
  .fb-wrong{color:var(--red); font-size:12px; margin-top:2px}
  .good{color:var(--green); font-weight:600}
  .bad2{color:var(--red); font-weight:600}

  .whole-input{
    width:100%; min-height:110px; padding:12px; border-radius:10px;
    border:1px solid #cbd5e1; font-size:15px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    resize:vertical; outline:none; line-height:1.7;
  }
  .whole-input:focus{border-color:var(--blue)}
  .whole-compare{
    margin-top:12px; padding:10px; border-radius:8px; background:#f8fafc;
    min-height:32px; line-height:2; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:15px; word-break:break-word;
  }
  .w-correct{color:var(--green)}
  .w-wrong{color:var(--red); text-decoration:underline wavy var(--red)}
  .w-target{color:var(--muted); font-size:12px; margin-left:2px}
  .w-extra{color:var(--red); text-decoration:line-through}

  /* 单词查词悬浮窗 */
  .dict-panel{
    position:fixed; right:18px; bottom:18px; z-index:9999;
    width:min(380px, calc(100vw - 24px)); max-height:min(62vh, 520px);
    display:flex; flex-direction:column;
    background:#fff; border:1px solid #e5e7eb; border-radius:14px;
    box-shadow:0 12px 40px rgba(17,24,39,.22), 0 2px 8px rgba(17,24,39,.08);
    overflow:hidden; animation:dictIn .18s ease-out;
  }
  @keyframes dictIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .dict-head{display:flex; align-items:center; gap:8px; padding:12px 14px; background:#f8fafc; border-bottom:1px solid #f1f5f9}
  .dict-word{flex:1; min-width:0; font-size:18px; font-weight:700; word-break:break-word}
  .dict-close{width:28px; height:28px; padding:0; border-radius:50%; background:#e5e7eb; color:#374151; font-size:16px; line-height:1}
  .dict-body{flex:1; overflow:auto; padding:12px 14px; font-size:14px; line-height:1.6}
  .dict-zh{font-size:16px; color:#111827; margin-bottom:8px; word-break:break-word}
  .dict-phon{color:var(--blue); font-size:13px; margin-bottom:6px}
  .dict-def{color:#374151; font-size:13px; margin:4px 0; line-height:1.6}
  .dict-def b{color:#111827}
  .dict-loading,.dict-empty{color:#9ca3af; font-size:13px}
  .dict-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 14px; border-top:1px solid #f1f5f9; font-size:12px}
  .dict-foot a{color:var(--blue); text-decoration:none}
  .dict-foot a:hover{text-decoration:underline}
  .dict-audio{padding:5px 10px; font-size:12px; border-radius:6px}

  @media (max-width:600px){
    .wrap{padding:12px}
    .slot .display,.slot .hidden-input{font-size:16px}
    .slot.nolen .display{width:24px; min-width:24px}
    .slot.nolen.w2 .display{width:18px; min-width:18px}
    .slot.nolen.w3 .display{width:28px; min-width:28px}
    .slot.nolen.active .display{min-width:18px}
    .slot.nolen.completed .display{width:auto; min-width:0; text-align:left; padding:2px 4px}
    .dict-panel{right:12px; left:12px; bottom:12px; width:auto; max-height:56vh}
    button{padding:8px 12px; font-size:13px}
    .tabs{padding:10px 12px 0}
    .mode-tab{padding:5px 9px; font-size:12px}
    .sentence-box{padding:14px}
    .line-no{flex-basis:20px; width:20px; height:20px; font-size:11px}
  }
</style>
</head>
<body>

<header>
  <h1>BeerMas 2027 考研作文模板拼写练习</h1>
  <p>小作文 + 大作文 · 逐词拼写 · 整句默写 · 全文默写</p>
</header>

<div class="tabs">
  <button class="tab active" data-tab="small">小作文</button>
  <button class="tab" data-tab="big">大作文</button>
</div>

<div class="wrap">
  <div id="errorBox" class="hidden" style="background:#fee2e2; color:#991b1b; padding:15px; border-radius:8px; margin-bottom:15px; font-weight:bold;">
    运行出错，请截图此信息反馈：<br><span id="errorMsg"></span>
  </div>

  <div id="homeView">
    <div id="cards-small" class="cards"></div>
    <div id="cards-big" class="cards hidden"></div>
  </div>

  <div id="practiceView" class="hidden">
    <div class="topbar">
      <button class="back" id="backBtn">← 返回</button>
      <strong id="tplTitle"></strong>
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="word">逐词</button>
        <button class="mode-tab hidden" data-mode="sentence">整句</button>
        <button class="mode-tab" data-mode="full">全文</button>
      </div>
    </div>

    <div class="sent-nav" id="sentNav"></div>

    <div id="wordModeBox">
      <div class="sentence-box">
        <div class="zh" id="zhText"></div>
        <div class="words" id="wordsArea"></div>
        <div id="wordFeedback" class="run-note hidden"></div>
        <div class="answer hidden" id="answerArea">
          <div class="label">正确答案（点击单词可查有道词典）</div>
          <div id="answerText"></div>
        </div>
        <div class="progress-line" id="progressLine"></div>
        <div class="hint">按空格或回车提交当前单词；错误字母会标红，可退格修改。</div>
      </div>
    </div>

    <div id="wholeModeBox" class="hidden">
      <div class="sentence-box">
        <div class="zh" id="zhTextWhole"></div>
        <textarea id="wholeInput" class="whole-input" placeholder="输入整句英文，占位符如 [主题词] 直接跳过..."></textarea>
        <div id="wholeCompare" class="whole-compare"></div>
        <div id="wholeFeedback" class="run-note hidden"></div>
        <div class="answer hidden" id="answerAreaWhole">
          <div class="label">正确答案（点击单词可查有道词典）</div>
          <div id="answerTextWhole"></div>
        </div>
        <div class="progress-line" id="progressLineWhole"></div>
        <div class="hint">实时比对：绿色正确，红色错误，灰色为正确写法提示。占位符直接跳过。</div>
      </div>
    </div>

    <div id="fullModeBox" class="hidden">
      <div class="sentence-box">
        <div class="full-head">
          <span class="full-head-title">全文默写 · 逐句</span>
          <button class="ghost" id="fullZhBtn" title="显示 / 模糊当前句中文">中文提示</button>
        </div>
        <div class="zh zh-full blurred" id="zhHintFull"></div>
        <div class="full-lines" id="fullWordsArea"></div>
        <div id="fullFeedback" class="feedback hidden"></div>
        <div class="answer hidden" id="fullAnswerArea">
          <div class="label">正确答案（逐句对照，点击单词可查有道词典）</div>
          <div id="fullAnswerText"></div>
        </div>
        <div class="progress-line" id="progressLineFull"></div>
        <div class="hint">每句一行；横线为 2~3 个字符宽的短线，与字母数无关。可跳到上一句/下一句，也可单独重练某一句。</div>
      </div>
    </div>

    <div class="controls">
      <button class="ghost" id="prevBtn">上一句</button>
      <button class="ghost" id="nextBtn">下一句</button>
      <button class="ghost" id="retryBtn">重练本句</button>
      <button class="ghost hidden" id="resetFullBtn">重练全文</button>
      <button id="showAnswerBtn">显示答案</button>
    </div>
  </div>
</div>

<div id="dictPanel" class="dict-panel hidden" role="dialog" aria-label="单词查询">
  <div class="dict-head">
    <div class="dict-word" id="dictWord"></div>
    <button class="dict-close" id="dictClose" aria-label="关闭">×</button>
  </div>
  <div class="dict-body" id="dictBody"><div class="dict-loading">查询中…</div></div>
  <div class="dict-foot">
    <button class="dict-audio hidden" id="dictAudio">🔊 发音</button>
    <a id="dictYoudao" href="#" target="_blank" rel="noopener">在有道词典打开 ↗</a>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, error) {
  document.getElementById('errorBox').classList.remove('hidden');
  document.getElementById('errorMsg').textContent = msg + ' (Line ' + line + ')';
};

try {

  const allData = {
    small: {
      label: '小作文',
      templates: [
        {
          id: 'advice',
          title: '建议 / 介绍信',
          sentences: [
            { en: `I was absolutely delighted to receive your letter.`, zh: `收到你的来信我非常高兴。` },
            { en: `Knowing that you are planning to [填空①：对方打算做的事情], I am writing to offer you some practical suggestions regarding this matter.`, zh: `得知你打算……，我写信是为了就此事向你提供一些实用建议。` },
            { en: `To begin with, I highly recommend that you should [填空②：建议一].`, zh: `首先，我强烈建议你应该……。` },
            { en: `This will not only [填空③：好处1A], but also [填空④：好处1B].`, zh: `这不仅会……，而且还能……。` },
            { en: `Furthermore, it would be a wise choice to [填空⑤：建议二], which will certainly help you to [填空⑥：好处2].`, zh: `此外，……将是一个明智的选择，这肯定会帮助你……。` },
            { en: `If time permits, you might as well [填空⑦：建议三].`, zh: `如果时间允许，你也不妨……。` },
            { en: `I sincerely hope that you will find these proposals helpful and practical.`, zh: `我真诚地希望你会觉得这些建议实用且有帮助。` },
            { en: `Please feel free to contact me if you need any further information.`, zh: `如果你需要任何进一步的信息，请随时与我联系。` },
            { en: `Wish you all the best!`, zh: `祝你一切顺利！` }
          ]
        },
        {
          id: 'complaint',
          title: '投诉信',
          sentences: [
            { en: `I am writing to express my deep dissatisfaction regarding [填空①：投诉对象], which I purchased / experienced at your place on [填空②：具体时间].`, zh: `我写信是为了对……表达我深深的不满，这是我于……在贵处购买/体验的。` },
            { en: `Frankly speaking, my experience completely fell short of my expectations.`, zh: `坦白地说，我的体验完全没有达到我的期望。` },
            { en: `To be specific, [填空③：具体问题1].`, zh: `具体而言，……。` },
            { en: `Furthermore, much to my disappointment, [填空④：具体问题2].`, zh: `此外，令我大失所望的是，……。` },
            { en: `This unexpected situation has caused me great inconvenience and trouble.`, zh: `这个意想不到的情况给我造成了极大的不便和麻烦。` },
            { en: `Under these circumstances, I strongly request that you should [填空⑤：你的诉求/建议].`, zh: `在这些情况下，我强烈要求你们应该……。` },
            { en: `I would highly appreciate it if you could look into this matter and provide me with a prompt and satisfactory solution.`, zh: `如果您能调查此事并给我提供一个迅速且满意的解决方案，我将不胜感激。` },
            { en: `I look forward to your early reply.`, zh: `期待您的早日回复。` }
          ]
        },
        {
          id: 'apology',
          title: '道歉信',
          sentences: [
            { en: `I am writing to express my sincere apologies for [填空①：你做错的事情].`, zh: `我写信是为了就……向您表达我最诚挚的歉意。` },
            { en: `I feel terribly guilty for my carelessness, and I completely understand that my mistake must have caused you great inconvenience.`, zh: `我对自己的粗心感到非常内疚，我完全理解我的失误一定给您带来了极大的不便。` },
            { en: `To be honest, [填空②：解释原因，一句话带过].`, zh: `老实说，……。` },
            { en: `To make up for my fault, I would like to [填空③：你的补偿方案].`, zh: `为了弥补我的过失，我想要……。` },
            { en: `Of course, if there is any better solution you prefer, please feel free to let me know.`, zh: `当然，如果您有任何更倾向的解决方案，请随时告诉我。` },
            { en: `Once again, please accept my heartfelt apologies for any trouble caused.`, zh: `再次为造成的任何麻烦请您接受我由衷的歉意。` },
            { en: `I sincerely hope you can forgive me.`, zh: `我真心希望您能原谅我。` }
          ]
        },
        {
          id: 'invitation',
          title: '邀请信',

  function normalizeSentence(s){
    return s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  const sentenceBank = {};
  const templatesByCategory = {};

  for (const cat in allData) {
    templatesByCategory[cat] = [];
    const tpls = allData[cat].templates;
    for (let i=0; i<tpls.length; i++) {
      const t = tpls[i];
      const ids = [];
      for (let j=0; j<t.sentences.length; j++) {
        const s = t.sentences[j];
        const key = cat + '::' + normalizeSentence(s.en);
        if (!sentenceBank[key]) {
          sentenceBank[key] = { id: key, en: s.en, zh: s.zh, category: cat };
        }
        ids.push(key);
      }
      templatesByCategory[cat].push({ id: t.id, title: t.title, sentenceIds: ids, category: cat });
    }
  }

  /* ================= 工具 ================= */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function targetCore(text){
    return text.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
  }
  function wordHint(text, core){
    if (!core) return text;
    const first = text.match(/[A-Za-z0-9]/);
    const firstChar = first ? first[0] : '';
    const rest = core.length - 1;
    return firstChar + (rest > 0 ? ' ' + '_ '.repeat(rest).trim() : '');
  }
  // 全文模式的下划线只给 2~3 个字符宽，并按单词散列在两种长度间浮动，
  // 与真实字母数无关，所以看不出单词到底有几个字母。
  function nolenClass(text){
    let h = 7;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) % 9973;
    return (h % 2 === 0) ? 'w2' : 'w3';
  }
  function getHint(text, core){
    return currentMode === 'full' ? '' : wordHint(text, core);
  }

  // 把答案渲染成带 有道词典 链接的 HTML
  function renderAnswerWithLinks(text) {

    const regex = /(\[[^\]]+\])/g;
    const parts = text.split(regex);
    let html = '';
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      if (part.startsWith('[') && part.endsWith(']')) {
        html += part;
      } else {
        html += part.replace(/([A-Za-z]+(?:['-][A-Za-z]+)*)/g, (word) => {
          return `<a href="${dictBase}${encodeURIComponent(word.toLowerCase())}/" target="_blank" class="dict-link">${word}</a>`;
        });

    }

  }

  /* ================= 掌握状态（按实际表现） ================= */

  function saveDraft(){
    const key = draftKey();
    if (!key) return;
    const done = [], m = {}, w = {};
    let anyDone = false;
    activeWordSlots.forEach((s, i) => {
      if (s.done) { done.push(i); anyDone = true; }
      if (s.mistakes) m[i] = s.mistakes;
      if (s.wrongTries && s.wrongTries.length) w[i] = s.wrongTries.slice(0, 5);
    });
    if (!anyDone && !runPeeked && Object.keys(m).length === 0) {
      delete drafts[key];
    } else {
      drafts[key] = { done, m, w, p: runPeeked ? 1 : 0 };
    }

  /* ================= 查词悬浮窗 ================= */
  function openDict(rawWord){
    const word = String(rawWord || '').replace(/\s+/g, ' ').trim();

    const key = word.toLowerCase();

    dictWordEl.textContent = word;

    dictBody.innerHTML = '<div class="dict-loading">正在查询“' + esc(word) + '”…</div>';
    const result = { zh: '', phon: '', defs: [] };
    let pending = 2;
    const done = () => {
      if (req !== dictReq) return;
      if (--pending > 0) return;
      dictCache.set(key, result);
      renderDict(result);
    };

    // 中文释义
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(key) + '&langpair=en|zh-CN')
      .then(r => r.json())
      .then(j => {
        const d = j && j.responseData && j.responseData.translatedText;

      .then(done);

    // 音标 + 英文释义

      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!Array.isArray(data) || !data.length) return;
        const entry = data[0] || {};

        result.phon = entry.phonetic || (phonetics.map(p => p && p.text).filter(Boolean)[0] || '');
        (entry.meanings || []).slice(0, 3).forEach(m => {
          const def = (m.definitions || [])[0];
          if (def && def.definition) result.defs.push({ pos: m.partOfSpeech || '', text: def.definition });
        });
      })
      .catch(() => {})
      .then(done);
  }

  /* ================= 分词 ================= */
  function tokenize(sentence){
    const raw = [];
    const regex = /(\[[^\]]+\])|([A-Za-z0-9]+(?:['’\-&][A-Za-z0-9]+)*)|([,.;:!?])/g;
    let lastIndex = 0;
    let m;
    while ((m = regex.exec(sentence)) !== null) {
      if (m.index > lastIndex) {
        const gap = sentence.slice(lastIndex, m.index).trim();
        if (gap) raw.push({ type:'punct', text: gap });
      }
      if (m[1]) raw.push({ type:'placeholder', text: m[1] });
      else if (m[2]) raw.push({ type:'word', text: m[2] });
      else if (m[3]) raw.push({ type:'punct', text: m[3] });
      lastIndex = regex.lastIndex;
    }
    const tail = sentence.slice(lastIndex).trim();
    if (tail) raw.push({ type:'punct', text: tail });

    const tokens = [];
    for (const r of raw) {
      if (r.type === 'punct') {
        if (tokens.length) tokens[tokens.length - 1].suffix += r.text;
      } else {
        tokens.push({ type: r.type, text: r.text, suffix: '' });
      }
    }
    return tokens;
  }

  /* ================= 逐词 / 全文 共用逻辑 ================= */
  function firstUndone(from){
    for (let i = from; i < activeWordSlots.length; i++) {
      if (!activeWordSlots[i].done) return i;
    }
    return activeWordSlots.length;
  }

  function refreshWordStates(){
    activeWordSlots.forEach((item, i) => {
      const el = item.el;
      const d = el.querySelector('.display');
      const oldInput = el.querySelector('.hidden-input');
      el.classList.remove('active', 'locked', 'completed');
      if (item.done) {
        el.classList.add('completed');
        if (oldInput) oldInput.remove();
        if (d) d.textContent = item.tok.text + item.tok.suffix;
      } else if (i === activeWordPos) {
        el.classList.add('active');
        if (!oldInput) setupWordInput(item);
      } else {
        el.classList.add('locked');
        if (oldInput) oldInput.remove();
        if (d) d.textContent = currentMode === 'full' ? '' : wordHint(item.tok.text, targetCore(item.tok.text));
      }
    });

    if (currentMode === 'full') updateFullLineStates();
    updateProgressLineAll();
    updateNav();

    const cur = activeWordSlots[activeWordPos];
    if (cur && !cur.done) {
      const input = cur.el.querySelector('.hidden-input');
      if (input) {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch(e){}
      }
      try { cur.el.scrollIntoView({ block: 'nearest' }); } catch(e){}
    }
  }

  function setupWordInput(item){
    const slot = item.el;
    const tok = item.tok;
    const core = targetCore(tok.text);
    const hint = currentMode === 'full' ? '' : wordHint(tok.text, core);

    slot.innerHTML = `<div class="display">${esc(hint)}</div><input class="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;

    const display = slot.querySelector('.display');
    const input = slot.querySelector('.hidden-input');

    input.addEventListener('input', () => {
      const value = input.value;
      if (!value) {
        display.innerHTML = esc(hint);
        return;
      }
      renderTyped(display, value, core);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        submitCurrentWord(item, input, display, core);
      }
    });
  }

  function renderTyped(display, value, core){
    let html = '';
    let coreIdx = 0;
    for (let i = 0; i < value.length; i++) {
      const ch = value[i];
      if (/[A-Za-z0-9]/.test(ch)) {
        const ok = core[coreIdx] === ch.toLowerCase();
        html += `<span class="${ok ? 'ok' : 'bad'}">${esc(ch)}</span>`;
        coreIdx++;
      } else {
        html += `<span class="neutral">${esc(ch)}</span>`;
      }
    }
    html += '<span class="caret"></span>';
    display.innerHTML = html;
  }

  function submitCurrentWord(item, input, display, core){
    const userCore = input.value.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
    if (userCore === core) {
      item.done = true;
      item.el.classList.remove('active');
      item.el.classList.add('completed');
      display.textContent = item.tok.text + item.tok.suffix;
      if (input.parentNode) input.remove();
      activeWordPos = activeWordSlots.indexOf(item) + 1;
      saveDraft();
      advanceToNextWord();
    } else {
      item.mistakes = (item.mistakes || 0) + 1;
      const attempt = input.value.trim();
      if (attempt && item.wrongTries.indexOf(attempt) < 0) item.wrongTries.push(attempt);
      item.el.classList.add('shake');
      setTimeout(() => item.el.classList.remove('shake'), 300);
      input.focus();
      saveDraft();
      updateProgressLineAll();
      if (currentMode === 'full') {
        updateFullLineStates();
        updateNav();
      }
    }
  }

  function advanceToNextWord(){
    let pos = activeWordPos;
    while (pos < activeWordSlots.length && activeWordSlots[pos].done) pos++;
    if (pos >= activeWordSlots.length) {
      pos = 0;
      while (pos < activeWordSlots.length && activeWordSlots[pos].done) pos++;
    }
    if (pos >= activeWordSlots.length) {
      activeWordPos = activeWordSlots.length;
      refreshWordStates();
      if (currentMode === 'full') finishFull();
      else finishWord();
      return;
    }
    activeWordPos = pos;
    refreshWordStates();
  }

  /* ================= 逐词模式 ================= */
  function renderSentence(){
    const sid = activeTemplate.sentenceIds[activeIndex];
    activeSentence = sentenceBank[sid];
    runPeeked = false;
    sentenceFinished = false;

    tplTitleEl.textContent = activeTemplate.title;
    zhTextEl.textContent = activeSentence.zh;
    wordsArea.innerHTML = '';
    answerArea.classList.add('hidden');
    answerText.innerHTML = renderAnswerWithLinks(activeSentence.en);
    wordFeedback.classList.add('hidden');
    wordFeedback.classList.remove('pass', 'fail');
    wordFeedback.textContent = '';
    showAnswerBtn.textContent = '显示答案';

    activeTokens = tokenize(activeSentence.en);
    activeWordSlots = [];
    activeWordPos = 0;

    activeTokens.forEach((tok) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (tok.type === 'placeholder') {
        slot.classList.add('placeholder', 'completed');
        slot.innerHTML = `<div class="display">${esc(tok.text + tok.suffix)}</div>`;
      } else {
        slot.classList.add('locked');
        const core = targetCore(tok.text);
        slot.innerHTML = `<div class="display">${esc(wordHint(tok.text, core))}</div>`;
        activeWordSlots.push({ tok, el: slot, done: false, mistakes: 0, wrongTries: [], lineSi: null });
      }
      wordsArea.appendChild(slot);
    });

    const d = getDraft();
    if (d) restoreSlotStates(d);

    if (activeWordSlots.length && activeWordSlots.every(s => s.done)) {
      clearDraft();
      activeWordSlots.forEach(s => { s.done = false; s.mistakes = 0; s.wrongTries = []; });
      runPeeked = false;
    }

    activeWordPos = firstUndone(0);
    refreshWordStates();

    if (activeWordSlots.length && activeWordPos >= activeWordSlots.length) finishWord();
  }

  function finishWord(){
    if (sentenceFinished) return;
    sentenceFinished = true;
    const sid = activeTemplate.sentenceIds[activeIndex];

    answerArea.classList.remove('hidden');
    answerText.innerHTML = renderAnswerWithLinks(activeSentence.en);
    showAnswerBtn.textContent = '隐藏答案';

    const mistakes = activeWordSlots.reduce((n, s) => n + (s.mistakes || 0), 0);
    applyRun(sid, mistakes, runPeeked);
    clearDraft();

    const clean = mistakes === 0 && !runPeeked;
    wordFeedback.classList.remove('hidden', 'pass', 'fail');
    wordFeedback.classList.add(clean ? 'pass' : 'fail');
    wordFeedback.textContent = clean
      ? `✅ 本句一次全对，已掌握（累计全对 ${getRec(sid).cleanRuns || 1} 次）`
      : (mistakes === 0
          ? '⚠ 本次全对，但查看过答案，暂标记为需巩固'
          : `⚠ 本次错误 ${mistakes} 处${runPeeked ? '，且查看过答案' : ''}，标记为需巩固`);

    saveProgress();
    renderHome();
    updateProgressLineAll();
    updateNav();
  }

  /* ================= 整句模式 ================= */
  function getTargetWords(sentence){
    const tokens = tokenize(sentence);
    return tokens.filter(t => t.type === 'word').map(t => ({
      core: t.text.replace(/[^A-Za-z0-9]/g, '').toLowerCase(),
      original: t.text
    }));
  }

  function compareWhole(userText, targetWords){
    const userWords = userText.trim().split(/\s+/).filter(Boolean);
    const results = [];
    const maxLen = Math.max(targetWords.length, userWords.length);
    for (let i = 0; i < maxLen; i++) {
      const t = targetWords[i] || null;
      const u = userWords[i] || null;
      if (u) {
        const uCore = u.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
        if (t && uCore === t.core) {
          results.push({ status: 'correct', user: u, target: t.original });
        } else if (t) {
          results.push({ status: 'wrong', user: u, target: t.original });
        } else {
          results.push({ status: 'extra', user: u, target: null });
        }
      }
    }
    return results;
  }

  function renderCompare(results){
    wholeCompare.innerHTML = results.map(r => {
      if (r.status === 'correct') return `<span class="w-correct">${esc(r.user)}</span>`;
      if (r.status === 'wrong') return `<span class="w-wrong">${esc(r.user)}</span><span class="w-target">→ ${esc(r.target)}</span>`;
      if (r.status === 'extra') return `<span class="w-extra">${esc(r.user)}</span>`;
      return '';
    }).join(' ');
  }

  function isWholeComplete(results, targetWords){
    if (results.length !== targetWords.length) return false;
    return results.every(r => r.status === 'correct');
  }

  function recordWholeMistakes(results){
    results.forEach((r, i) => {
      if (r.status !== 'correct') wholeWrongSeen.add(i);
    });
  }

  function renderWholeMode(){
    const sid = activeTemplate.sentenceIds[activeIndex];
    activeSentence = sentenceBank[sid];
    runPeeked = false;
    wholeFinished = false;
    wholeWrongSeen = new Set();

    tplTitleEl.textContent = activeTemplate.title;
    zhTextWhole.textContent = activeSentence.zh;
    answerAreaWhole.classList.add('hidden');
    answerTextWhole.innerHTML = renderAnswerWithLinks(activeSentence.en);
    wholeFeedback.classList.add('hidden');
    wholeFeedback.classList.remove('pass', 'fail');
    wholeFeedback.textContent = '';
    showAnswerBtn.textContent = '显示答案';
    wholeCompare.innerHTML = '';

    const d = getDraft();
    wholeInput.value = (d && typeof d.text === 'string') ? d.text : '';
    if (d) runPeeked = !!d.p;

    if (wholeInput.value) {
      const targetWords = getTargetWords(activeSentence.en);
      const results = compareWhole(wholeInput.value, targetWords);
      recordWholeMistakes(results);
      renderCompare(results);
      if (isWholeComplete(results, targetWords)) {
        clearDraft();
        wholeInput.value = '';
        wholeWrongSeen = new Set();
        runPeeked = false;
        wholeCompare.innerHTML = '';
      }
    }

    updateProgressLineAll();
    updateNav();
    wholeInput.focus();
  }

  function handleWholeInput(){
    if (!activeTemplate) return;
    const sid = activeTemplate.sentenceIds[activeIndex];
    const sentence = sentenceBank[sid];
    const targetWords = getTargetWords(sentence.en);
    const results = compareWhole(wholeInput.value, targetWords);
    recordWholeMistakes(results);
    renderCompare(results);

    if (!wholeFinished) {
      if (isWholeComplete(results, targetWords)) finishWhole();
      else updateProgressLineAll();
    }
  }

  function saveWholeDraft(){
    const key = draftKey();
    if (!key) return;
    const text = wholeInput.value;
    if (!text && !runPeeked) {
      delete drafts[key];
    } else {
      drafts[key] = { text, p: runPeeked ? 1 : 0 };
    }
    saveDrafts();
  }

  function finishWhole(){
    if (wholeFinished) return;
    wholeFinished = true;
    const sid = activeTemplate.sentenceIds[activeIndex];

    answerAreaWhole.classList.remove('hidden');
    answerTextWhole.innerHTML = renderAnswerWithLinks(activeSentence.en);
    showAnswerBtn.textContent = '隐藏答案';

    const mistakes = wholeWrongSeen.size;
    applyRun(sid, mistakes, runPeeked);
    clearDraft();

    const clean = mistakes === 0 && !runPeeked;
    wholeFeedback.classList.remove('hidden', 'pass', 'fail');
    wholeFeedback.classList.add(clean ? 'pass' : 'fail');
    wholeFeedback.textContent = clean
      ? `✅ 本句一次全对，已掌握（累计全对 ${getRec(sid).cleanRuns || 1} 次）`
      : (mistakes === 0
          ? '⚠ 本次全对，但查看过答案，暂标记为需巩固'
          : `⚠ 本次有 ${mistakes} 处拼写问题${runPeeked ? '，且查看过答案' : ''}，标记为需巩固`);

    saveProgress();
    renderHome();
    updateProgressLineAll();
    updateNav();
  }

  wholeInput.addEventListener('input', () => {
    handleWholeInput();
    const key = draftKey();
    clearTimeout(wholeSaveTimer);
    wholeSaveTimer = setTimeout(() => {
      if (key && key === draftKey()) saveWholeDraft();
    }, 250);
  });

  /* ================= 全文模式 ================= */
  function buildFullAnswer(){
    fullAnswerText.innerHTML = activeTemplate.sentenceIds.map((sid, i) => {
      return `<div class="ans-line"><span class="ans-no">${i + 1}</span><span class="ans-text">${renderAnswerWithLinks(sentenceBank[sid].en)}</span></div>`;
    }).join('');
  }

  function buildFullLines(){
    activeTemplate.sentenceIds.forEach((sid, si) => {
      const s = sentenceBank[sid];
      const lineEl = document.createElement('div');
      lineEl.className = 'full-line';

      const noEl = document.createElement('span');
      noEl.className = 'line-no';
      noEl.textContent = String(si + 1);

      const body = document.createElement('div');
      body.className = 'words';

      const line = { si, sid, el: lineEl, body, slots: [], applied: false };

      tokenize(s.en).forEach(tok => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        if (tok.type === 'placeholder') {
          slot.classList.add('placeholder', 'completed');
          slot.innerHTML = `<div class="display">${esc(tok.text + tok.suffix)}</div>`;
        } else {
          slot.classList.add('locked', 'nolen', nolenClass(tok.text));
          slot.innerHTML = '<div class="display"></div>';
          const item = { tok, el: slot, done: false, mistakes: 0, wrongTries: [], lineSi: si };
          activeWordSlots.push(item);
          line.slots.push(item);
        }
        body.appendChild(slot);
      });

      lineEl.appendChild(noEl);
      lineEl.appendChild(body);
      fullWordsArea.appendChild(lineEl);
      fullLines.push(line);
    });
  }

  function renderFullMode(){
    runPeeked = false;
    fullFinished = false;
    activeWordSlots = [];
    activeWordPos = 0;
    fullLines = [];
    fullCursor = 0;
    fullWordsArea.innerHTML = '';
    fullFeedback.classList.add('hidden');
    fullFeedback.innerHTML = '';
    fullAnswerArea.classList.add('hidden');
    showAnswerBtn.textContent = '显示答案';
    tplTitleEl.textContent = activeTemplate.title;

    buildFullAnswer();
    buildFullLines();

    const d = getDraft();
    if (d) restoreSlotStates(d);

    if (activeWordSlots.length && activeWordSlots.every(s => s.done)) {
      clearDraft();
      activeWordSlots.forEach(s => { s.done = false; s.mistakes = 0; s.wrongTries = []; });
      fullLines.forEach(l => l.el.classList.remove('pass', 'fail'));
      runPeeked = false;
    }

    activeWordPos = firstUndone(0);
    updateFullZh();
    refreshWordStates();

    if (activeWordSlots.length && activeWordPos >= activeWordSlots.length) finishFull();
  }

  function updateFullLineStates(){
    if (!fullLines.length) return;
    let si = fullCursor;
    const cur = activeWordSlots[activeWordPos];
    if (cur && cur.lineSi !== null && cur.lineSi !== undefined) {
      si = cur.lineSi;
    } else {
      for (let i = activeWordSlots.length - 1; i >= 0; i--) {
        if (activeWordSlots[i].done) { si = activeWordSlots[i].lineSi; break; }
      }
    }
    fullCursor = Math.max(0, Math.min(fullLines.length - 1, si));
    fullLines.forEach(l => l.el.classList.toggle('cur', l.si === fullCursor));
    const line = fullLines[fullCursor];
    if (line) {
      const s = sentenceBank[line.sid];
      zhHintFull.textContent = s ? ('第 ' + (fullCursor + 1) + ' 句中文：' + s.zh) : '';
    }
  }

  function collectWrong(line){
    const wrong = [];
    line.slots.forEach(s => {
      if (s.wrongTries && s.wrongTries.length) {
        wrong.push({ target: s.tok.text, tries: s.wrongTries.slice(0, 3) });
      }
    });
    return wrong;
  }

  function renderFullFeedback(results){
    const pass = results.filter(r => r.mistakes === 0).length;
    const fail = results.length - pass;
    let html = '<div class="fb-sum">逐句反馈：<span class="good">' + pass + ' 句正确</span> · <span class="bad2">' + fail + ' 句有错</span>';
    if (runPeeked) html += ' · <span class="bad2">本次查看过答案，不计入掌握</span>';
    html += '</div>';

    results.forEach(r => {
      const s = sentenceBank[r.sid];
      const ok = r.mistakes === 0;
      html += '<div class="fb-item"><div class="fb-no">' + (r.si + 1) + '</div><div class="fb-body">';
      html += '<span class="' + (ok ? 'good' : 'bad2') + '">' + (ok ? '✔ 正确' : '✘ 有错') + '</span>';
      if (!ok) {
        if (r.wrong.length) {
          html += '<div class="fb-wrong">拼错：' + r.wrong.map(w => esc(w.target) + ' → ' + esc(w.tries.join(' / '))).join('；') + '</div>';
        } else {
          html += '<div class="fb-wrong">' + (runPeeked ? '查看过答案' : '有拼写错误') + '</div>';
        }
      }
      if (s) html += '<div class="fb-en">' + renderAnswerWithLinks(s.en) + '</div>';
      html += '</div></div>';
    });

    fullFeedback.innerHTML = html;
    fullFeedback.classList.remove('hidden');
  }

  function finishFull(){
    if (fullFinished) return;
    fullFinished = true;

    fullAnswerArea.classList.remove('hidden');
    showAnswerBtn.textContent = '隐藏答案';

    const results = fullLines.map(line => {
      const mistakes = line.slots.reduce((n, s) => n + (s.mistakes || 0), 0);
      return { si: line.si, sid: line.sid, line, mistakes, wrong: collectWrong(line) };
    });

    results.forEach(r => {
      const clean = r.mistakes === 0;
      r.line.el.classList.toggle('pass', clean);
      r.line.el.classList.toggle('fail', !clean);
      if (!r.line.applied) {
        applyRun(r.sid, r.mistakes, runPeeked);
        r.line.applied = true;
      }
    });

    const totalMistakes = results.reduce((n, r) => n + r.mistakes, 0);
    applyRun(tplKey() + '::full', totalMistakes, runPeeked);
    clearDraft();

    renderFullFeedback(results);
    saveProgress();
    renderHome();
    updateProgressLineAll();
    updateNav();
  }

  function retryFullLine(){
    if (!fullLines.length) return;
    const line = fullLines[fullCursor];
    if (!line || !line.slots.length) return;

    line.slots.forEach(s => { s.done = false; s.mistakes = 0; s.wrongTries = []; });
    line.el.classList.remove('pass', 'fail');
    line.applied = false;
    fullFinished = false;
    fullAnswerArea.classList.add('hidden');
    fullFeedback.classList.add('hidden');
    fullFeedback.innerHTML = '';
    showAnswerBtn.textContent = '显示答案';

    activeWordPos = activeWordSlots.indexOf(line.slots[0]);
    saveDraft();
    refreshWordStates();
  }

  function resetFull(){
    clearDraft();
    renderFullMode();
  }

  /* ================= 答案 / 跳过 / 重练 ================= */
  function markPeek(sid){
    if (runPeeked) {
      updateProgressLineAll();
      return;
    }
    runPeeked = true;
    const r = getRec(sid);
    r.peeks = (r.peeks || 0) + 1;
    saveProgress();
    saveDraft();
    updateProgressLineAll();
  }

  showAnswerBtn.onclick = () => {
    if (currentMode === 'full') {
      const finished = fullFinished;
      if (fullAnswerArea.classList.contains('hidden')) {
        fullAnswerArea.classList.remove('hidden');
        showAnswerBtn.textContent = '隐藏答案';
        if (!finished) markPeek(tplKey() + '::full');
      } else {
        fullAnswerArea.classList.add('hidden');
        showAnswerBtn.textContent = '显示答案';
      }
      return;
    }

    const sid = activeTemplate.sentenceIds[activeIndex];

    if (currentMode === 'sentence') {
      if (answerAreaWhole.classList.contains('hidden')) {
        answerAreaWhole.classList.remove('hidden');
        answerTextWhole.innerHTML = renderAnswerWithLinks(activeSentence.en);
        showAnswerBtn.textContent = '隐藏答案';
        if (!wholeFinished) markPeek(sid);
      } else {
        answerAreaWhole.classList.add('hidden');
        showAnswerBtn.textContent = '显示答案';
      }
      return;
    }

    if (answerArea.classList.contains('hidden')) {
      answerArea.classList.remove('hidden');
      answerText.innerHTML = renderAnswerWithLinks(activeSentence.en);
      showAnswerBtn.textContent = '隐藏答案';
      if (!sentenceFinished) markPeek(sid);
    } else {
      answerArea.classList.add('hidden');
      showAnswerBtn.textContent = '显示答案';
    }
  };

  prevBtn.onclick = () => {
    jumpToSentence((currentMode === 'full' ? fullCursor : activeIndex) - 1);
  };

  nextBtn.onclick = () => {
    jumpToSentence((currentMode === 'full' ? fullCursor : activeIndex) + 1);
  };

  retryBtn.onclick = () => {
    if (currentMode === 'full') {
      retryFullLine();
      return;
    }
    clearDraft();
    if (currentMode === 'word') renderSentence();
    else renderWholeMode();
  };

  resetFullBtn.onclick = () => {
    resetFull();
  };

  backBtn.onclick = () => {
    if (currentMode === 'sentence' && activeTemplate) {
      try { saveWholeDraft(); } catch(e){}
    }
    if (currentMode === 'full' && activeTemplate && fullLines.length) {
      activeIndex = Math.min(fullCursor, activeTemplate.sentenceIds.length - 1);
    }
    savePosition();
    practiceView.classList.add('hidden');
    homeView.classList.remove('hidden');
    saveJSON(SESSION_KEY, null);
    switchTab(currentTab);
    renderHome();
  };

  /* ================= 模式切换 / 初始化 ================= */
  modeTabs.addEventListener('click', e => {
    const btn = e.target.closest('.mode-tab');
    if (!btn) return;
    const mode = btn.dataset.mode;
    if (mode === currentMode) return;
    if (mode === 'sentence' && activeCategory !== 'big') return;
    if (currentMode === 'full' && mode !== 'full' && fullLines.length) {
      activeIndex = Math.min(fullCursor, activeTemplate.sentenceIds.length - 1);
    }
    if (currentMode === 'sentence') {
      try { saveWholeDraft(); } catch(e){}
    }
    switchMode(mode);
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => switchTab(tab.dataset.tab);
  });

  window.addEventListener('beforeunload', () => {
    if (currentMode === 'sentence' && activeTemplate) {
      try { saveWholeDraft(); } catch(e){}
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && currentMode === 'sentence' && activeTemplate) {
      try { saveWholeDraft(); } catch(e){}
    }
  });

  renderHome();

  const savedSession = loadJSON(SESSION_KEY, null);
  if (savedSession && savedSession.cat && savedSession.id && findTemplate(savedSession.cat, savedSession.id)) {
    currentTab = (savedSession.tab === 'big') ? 'big' : (savedSession.cat === 'big' ? 'big' : 'small');
    switchTab(currentTab);
    openTemplate(savedSession.cat, savedSession.id, savedSession);
  } else {
    switchTab('small');
    updateFullZh();
  }

} catch(e) {
  document.getElementById('errorBox').classList.remove('hidden');
  document.getElementById('errorMsg').textContent = e.message;
}
</script>
</body>
</html>
